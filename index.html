<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#От_Омска_не_убежишь — километры клуба</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f1eb;color:#222}
  .wrap{max-width:1100px;margin:auto;padding:28px 18px 50px}
  header{background:#202020;color:white;border-radius:24px;padding:30px;margin-bottom:20px}
  h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}
  .sub{opacity:.72}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
  button{border:0;border-radius:999px;padding:10px 17px;background:white;cursor:pointer;font-weight:700}
  button.active{background:#222;color:white}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .card{background:white;border-radius:18px;padding:20px}
  .label{font-size:13px;color:#777;margin-bottom:8px}
  .value{font-size:30px;font-weight:800}
  .unit{font-size:14px;color:#777}
  .grid{display:grid;grid-template-columns:1.35fr .9fr;gap:16px;margin-top:16px}
  section{background:white;border-radius:20px;padding:22px}
  h2{margin:0 0 18px;font-size:21px}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
  .rank:last-child{border-bottom:0}
  .place{width:28px;font-weight:800}
  .name{flex:1;font-weight:700}
  .km{font-weight:800}
  .bar{height:9px;background:#eee;border-radius:99px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:#222;border-radius:99px}
  .month{display:grid;grid-template-columns:70px 1fr 65px;gap:10px;align-items:center;margin:12px 0}
  .monthbar{height:12px;background:#eee;border-radius:99px;overflow:hidden}
  .monthbar i{display:block;height:100%;background:#555}
  .note{margin-top:16px;color:#777;font-size:13px}
  @media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
  @media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.value{font-size:23px}.card{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>#От_Омска_не_убежишь</h1>
  <div class="sub">Километры клуба · первая версия статистики</div>
</header>

<div class="tabs">
  <button class="active" onclick="setPeriod('month',this)">Октябрь</button>
  <button onclick="setPeriod('quarter',this)">IV квартал</button>
  <button onclick="setPeriod('year',this)">2026</button>
  <button onclick="setPeriod('all',this)">Всё время</button>
</div>

<div class="cards">
  <div class="card"><div class="label">Километраж клуба</div><div class="value" id="total">0</div><div class="unit">км</div></div>
  <div class="card"><div class="label">Участников</div><div class="value" id="people">0</div><div class="unit">бегунов</div></div>
  <div class="card"><div class="label">Тренировок</div><div class="value" id="runs">0</div><div class="unit">пробежек</div></div>
  <div class="card"><div class="label">Среднее</div><div class="value" id="avg">0</div><div class="unit">км / участника</div></div>
</div>

<div class="grid">
<section>
  <h2>🏆 Рейтинг участников</h2>
  <div id="ranking"></div>
</section>

<section>
  <h2>📊 Километраж по месяцам</h2>
  <div id="months"></div>
  <div class="note">В демонстрационной версии стоят тестовые данные. Их можно заменить данными клуба.</div>
</section>
</div>
</div>

<script>
const SHEET_URL =
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vQan5aWH0h1auf7wBZbeTlRkgK3WreXEg24CjR0o-zo5aGvLGyFtTNK11pTCFJBNN0H_aC2thKuHjA4/pub?gid=2014016142&single=true&output=csv';

let period = 'all';
let sheetData = {
  totalKm: 0,
  runs: 0,
  people: 0,
  avg: 0,
  ranking: [],
  months: []
};

const monthsNames = [
  'Янв','Фев','Мар','Апр','Май','Июн',
  'Июл','Авг','Сен','Окт','Ноя','Дек'
];

/* ---------- CSV ---------- */

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let quotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && quotes && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      quotes = !quotes;
    } else if (char === ',' && !quotes) {
      row.push(cell);
      cell = '';
    } else if ((char === '\n' || char === '\r') && !quotes) {
      if (char === '\r' && next === '\n') i++;

      row.push(cell);
      cell = '';

      if (row.some(x => x.trim() !== '')) {
        rows.push(row);
      }

      row = [];
    } else {
      cell += char;
    }
  }

  row.push(cell);

  if (row.some(x => x.trim() !== '')) {
    rows.push(row);
  }

  return rows;
}

/* ---------- загрузка Google Sheets ---------- */

async function loadData() {
  try {
    const response = await fetch(SHEET_URL + '&_=' + Date.now());

    if (!response.ok) {
      throw new Error('Не удалось загрузить таблицу');
    }

    const csv = await response.text();
    const rows = parseCSV(csv);

    /*
      СТРУКТУРА ЛИСТА "Сайт":

      A:B — общая статистика
      D:F — рейтинг
      H:J — месяцы
    */

    // Общая статистика
    sheetData.totalKm = parseFloat(
      String(rows[0]?.[1] || '0').replace(',', '.')
    ) || 0;

    sheetData.runs = parseInt(
      rows[1]?.[1] || '0'
    ) || 0;

    sheetData.people = parseInt(
      rows[2]?.[1] || '0'
    ) || 0;

    sheetData.avg = parseFloat(
      String(rows[3]?.[1] || '0').replace(',', '.')
    ) || 0;


    // Рейтинг участников
    sheetData.ranking = [];

    for (let i = 2; i < rows.length; i++) {
      const place = rows[i]?.[3];
      const name = rows[i]?.[4];
      const km = rows[i]?.[5];

      if (name && name.trim() !== '') {
        sheetData.ranking.push({
          place: place || '',
          name: name.trim(),
          km: parseFloat(
            String(km || '0').replace(',', '.')
          ) || 0
        });
      }
    }


    // Месячная статистика
    sheetData.months = [];

    for (let i = 1; i < rows.length; i++) {
      const month = rows[i]?.[7];
      const km = rows[i]?.[8];
      const runs = rows[i]?.[9];

      if (month && /^\d{4}-\d{2}$/.test(month.trim())) {
        sheetData.months.push({
          month: month.trim(),
          km: parseFloat(
            String(km || '0').replace(',', '.')
          ) || 0,
          runs: parseInt(runs || '0') || 0
        });
      }
    }

    render();

  } catch (error) {
    console.error(error);

    document.getElementById('ranking').innerHTML =
      '<div class="note">Не удалось загрузить данные</div>';

    document.getElementById('months').innerHTML =
      '<div class="note">Не удалось загрузить данные</div>';
  }
}


/* ---------- фильтр периода ---------- */

function getPeriodData() {

  // Всё время
  if (period === 'all') {
    return {
      km: sheetData.totalKm,
      runs: sheetData.runs
    };
  }

  const now = new Date();

  let filtered = [];

  if (period === 'month') {

    // Берём последний месяц из таблицы
    if (sheetData.months.length) {
      const latest = sheetData.months[
        sheetData.months.length - 1
      ].month;

      filtered = sheetData.months.filter(
        x => x.month === latest
      );
    }

  } else if (period === 'quarter') {

    const latest = sheetData.months[
      sheetData.months.length - 1
    ];

    if (latest) {
      const year = parseInt(latest.month.substring(0, 4));
      const month = parseInt(latest.month.substring(5, 7));

      const quarter = Math.floor((month - 1) / 3);

      filtered = sheetData.months.filter(x => {
        const y = parseInt(x.month.substring(0, 4));
        const m = parseInt(x.month.substring(5, 7));
        const q = Math.floor((m - 1) / 3);

        return y === year && q === quarter;
      });
    }

  } else if (period === 'year') {

    const latest = sheetData.months[
      sheetData.months.length - 1
    ];

    if (latest) {
      const year = latest.month.substring(0, 4);

      filtered = sheetData.months.filter(
        x => x.month.startsWith(year)
      );
    }
  }

  return {
    km: filtered.reduce((sum, x) => sum + x.km, 0),
    runs: filtered.reduce((sum, x) => sum + x.runs, 0)
  };
}


/* ---------- отрисовка ---------- */

function render() {

  const periodData = getPeriodData();

  document.getElementById('total').textContent =
    periodData.km.toFixed(2);

  document.getElementById('runs').textContent =
    periodData.runs;

  /*
    Количество участников и рейтинг сейчас берём
    из общего рейтинга листа "Сайт".
  */

  document.getElementById('people').textContent =
    sheetData.people;

  document.getElementById('avg').textContent =
    sheetData.avg.toFixed(2);


  /* ---------- рейтинг ---------- */

  const ranking = sheetData.ranking;

  const max =
    Math.max(...ranking.map(x => x.km), 1);

  document.getElementById('ranking').innerHTML =
    ranking.map((x, i) => {

      let place;

      if (i === 0) {
        place = '🥇';
      } else if (i === 1) {
        place = '🥈';
      } else if (i === 2) {
        place = '🥉';
      } else {
        place = i + 1;
      }

      return `
        <div class="rank">

          <div class="place">
            ${place}
          </div>

          <div class="name">
            ${x.name}

            <div class="bar">
              <i style="width:${(x.km / max) * 100}%"></i>
            </div>
          </div>

          <div class="km">
            ${x.km.toFixed(2)} км
          </div>

        </div>
      `;
    }).join('') ||
    '<div class="note">Пока нет данных</div>';


  /* ---------- месяцы ---------- */

  const monthly = sheetData.months;

  const maxMonth =
    Math.max(...monthly.map(x => x.km), 1);

  document.getElementById('months').innerHTML =
    monthly.map(x => {

      const year =
        x.month.substring(0, 4);

      const monthNumber =
        parseInt(x.month.substring(5, 7));

      const monthName =
        monthsNames[monthNumber - 1];

      return `
        <div class="month">

          <b>
            ${monthName} ${year}
          </b>

          <div class="monthbar">
            <i style="width:${(x.km / maxMonth) * 100}%"></i>
          </div>

          <b>
            ${x.km.toFixed(2)} км
          </b>

        </div>
      `;

    }).join('') ||
    '<div class="note">Пока нет данных</div>';
}


/* ---------- кнопки периода ---------- */

function setPeriod(p, btn) {

  period = p;

  document
    .querySelectorAll('button')
    .forEach(b => b.classList.remove('active'));

  btn.classList.add('active');

  render();
}


/* ---------- запуск ---------- */

loadData();
</script>
</body>
</html>
