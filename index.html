<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>#От_Омска_не_убежишь — километры клуба</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f4f1eb;
  color:#222;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px 16px 50px;
}

/* ---------- ШАПКА ---------- */

header{
  background:#202020;
  color:white;
  border-radius:24px;
  padding:30px;
  margin-bottom:18px;
}

h1{
  margin:0 0 8px;
  font-size:clamp(28px,5vw,48px);
  line-height:1.05;
}

.sub{
  opacity:.7;
  font-size:15px;
}

/* ---------- ПЕРИОДЫ ---------- */

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:16px 0;
}

button{
  border:0;
  border-radius:999px;
  padding:10px 17px;
  background:white;
  cursor:pointer;
  font-weight:700;
  color:#222;
}

button.active{
  background:#222;
  color:white;
}

/* ---------- КАРТОЧКИ ---------- */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
}

.label{
  font-size:13px;
  color:#777;
  margin-bottom:8px;
}

.value{
  font-size:30px;
  font-weight:800;
}

.unit{
  font-size:14px;
  color:#777;
}

/* ---------- ОСНОВНАЯ СЕТКА ---------- */

.grid{
  display:grid;
  grid-template-columns:1.35fr .9fr;
  gap:16px;
  margin-top:16px;
}

section{
  background:white;
  border-radius:20px;
  padding:22px;
}

h2{
  margin:0 0 18px;
  font-size:21px;
}

/* ---------- РЕЙТИНГ ---------- */

.rank{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.rank:last-child{
  border-bottom:0;
}

.place{
  width:32px;
  min-width:32px;
  font-weight:800;
}

.name{
  flex:1;
  font-weight:700;
  min-width:0;
}

.km{
  font-weight:800;
  white-space:nowrap;
}

.bar{
  height:9px;
  background:#eee;
  border-radius:99px;
  overflow:hidden;
  margin-top:6px;
}

.bar>i{
  display:block;
  height:100%;
  background:#222;
  border-radius:99px;
}

/* ---------- МЕСЯЦЫ ---------- */

.month{
  display:grid;
  grid-template-columns:90px 1fr 75px;
  gap:10px;
  align-items:center;
  margin:12px 0;
}

.monthbar{
  height:12px;
  background:#eee;
  border-radius:99px;
  overflow:hidden;
}

.monthbar i{
  display:block;
  height:100%;
  background:#555;
}

.note{
  margin-top:16px;
  color:#777;
  font-size:13px;
  line-height:1.5;
}

/* ---------- СТАТУС ---------- */

.status{
  margin-top:14px;
  font-size:13px;
  color:#777;
}

.status.ok{
  color:#3b6b42;
}

.status.error{
  color:#a33;
}

/* ---------- МОБИЛЬНАЯ ВЕРСИЯ ---------- */

@media(max-width:800px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:480px){

  .wrap{
    padding:12px 10px 35px;
  }

  header{
    padding:22px;
    border-radius:20px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .card{
    padding:15px;
  }

  .value{
    font-size:24px;
  }

  .unit{
    font-size:12px;
  }

  section{
    padding:17px;
  }

  .month{
    grid-template-columns:65px 1fr 55px;
    gap:7px;
    font-size:12px;
  }

  .km{
    font-size:13px;
  }

}

</style>
</head>

<body>

<div class="wrap">

<header>

  <h1>#От_Омска_не_убежишь</h1>

  <div class="sub">
    Километры клуба
  </div>

  <div id="status" class="status">
    Загружаем статистику…
  </div>

</header>


<!-- ПЕРИОДЫ -->

<div class="tabs">

  <button id="monthButton"
          onclick="setPeriod('month',this)">
    Последний месяц
  </button>

  <button id="quarterButton"
          onclick="setPeriod('quarter',this)">
    Квартал
  </button>

  <button id="yearButton"
          onclick="setPeriod('year',this)">
    Год
  </button>

  <button onclick="setPeriod('all',this)">
    Всё время
  </button>

</div>


<!-- ОСНОВНЫЕ ПОКАЗАТЕЛИ -->

<div class="cards">

  <div class="card">

    <div class="label">
      Километраж клуба
    </div>

    <div class="value" id="total">
      0
    </div>

    <div class="unit">
      км
    </div>

  </div>


  <div class="card">

    <div class="label">
      Участников
    </div>

    <div class="value" id="people">
      0
    </div>

    <div class="unit">
      бегунов
    </div>

  </div>


  <div class="card">

    <div class="label">
      Тренировок
    </div>

    <div class="value" id="runs">
      0
    </div>

    <div class="unit">
      пробежек
    </div>

  </div>


  <div class="card">

    <div class="label">
      Среднее
    </div>

    <div class="value" id="avg">
      0
    </div>

    <div class="unit">
      км / участника
    </div>

  </div>

</div>


<!-- НИЖНЯЯ ЧАСТЬ -->

<div class="grid">


<section>

  <h2>
    🏆 Рейтинг участников
  </h2>

  <div id="ranking">
    <div class="note">
      Загружаем данные…
    </div>
  </div>

</section>


<section>

  <h2>
    📊 Километраж по месяцам
  </h2>

  <div id="months">
    <div class="note">
      Загружаем данные…
    </div>
  </div>

</section>


</div>

</div>


<script>

/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

const SHEET_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vQan5aWH0h1auf7wBZbeTlRkgK3WreXEg24CjR0o-zo5aGvLGyFtTNK11pTCFJBNN0H_aC2thKuHjA4/pub?gid=0&single=true&output=csv';


/* =====================================================
   ДАННЫЕ
   ===================================================== */

let allRuns = [];

let period = 'month';


const monthsNames = [
  'Янв',
  'Фев',
  'Мар',
  'Апр',
  'Май',
  'Июн',
  'Июл',
  'Авг',
  'Сен',
  'Окт',
  'Ноя',
  'Дек'
];


/* =====================================================
   CSV
   ===================================================== */

function parseCSV(text){

  const rows = [];

  let row = [];
  let cell = '';
  let quotes = false;


  for(let i = 0; i < text.length; i++){

    const char = text[i];
    const next = text[i + 1];


    if(char === '"' && quotes && next === '"'){

      cell += '"';

      i++;

    }

    else if(char === '"'){

      quotes = !quotes;

    }

    else if(char === ',' && !quotes){

      row.push(cell);

      cell = '';

    }

    else if(
      (char === '\n' || char === '\r') &&
      !quotes
    ){

      if(char === '\r' && next === '\n'){
        i++;
      }

      row.push(cell);

      cell = '';


      if(row.some(x => x.trim() !== '')){

        rows.push(row);

      }

      row = [];

    }

    else{

      cell += char;

    }

  }


  if(cell !== '' || row.length){

    row.push(cell);

  }


  if(row.some(x => x.trim() !== '')){

    rows.push(row);

  }


  return rows;

}


/* =====================================================
   ДАТА
   ===================================================== */

function parseDate(value){

  if(!value) return null;


  value = String(value).trim();


  /*
    Формат 2026-10-02
  */

  if(/^\d{4}-\d{2}-\d{2}/.test(value)){

    const parts = value.substring(0,10).split('-');

    return new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );

  }


  /*
    Формат 02.10.2026
  */

  if(/^\d{1,2}\.\d{1,2}\.\d{4}/.test(value)){

    const parts = value.substring(0,10).split('.');

    return new Date(
      Number(parts[2]),
      Number(parts[1]) - 1,
      Number(parts[0])
    );

  }


  /*
    Если Google вернул другой формат
  */

  const d = new Date(value);

  return isNaN(d) ? null : d;

}


/* =====================================================
   ЧИСЛО
   ===================================================== */

function parseNumber(value){

  if(value === undefined || value === null){
    return 0;
  }

  return parseFloat(
    String(value)
      .replace(/\s/g,'')
      .replace(',','.')
  ) || 0;

}


/* =====================================================
   ЗАГРУЗКА
   ===================================================== */

async function loadData(){

  try{

    const response =
      await fetch(
        SHEET_URL + '&_=' + Date.now()
      );


    if(!response.ok){

      throw new Error(
        'Google Таблица недоступна'
      );

    }


    const csv =
      await response.text();


    const rows =
      parseCSV(csv);


    if(rows.length < 2){

      throw new Error(
        'В таблице нет данных'
      );

    }


    /*
      Структура:

      A Дата
      B Участник
      C км
      D Общее время
      E Темп
      F Тип тренировки
      G Комментарий
      H часы
      I минуты
      J секунды
      K Статус
    */


    allRuns = [];


    for(let i = 1; i < rows.length; i++){

      const row = rows[i];


      const date =
        parseDate(row[0]);


      const name =
        String(row[1] || '').trim();


      const km =
        parseNumber(row[2]);


      const status =
        String(row[10] || '').trim();


      /*
        Только реальные учтённые пробежки
      */

      if(!date) continue;

      if(!name) continue;

      if(km <= 0) continue;

      if(status !== 'Учитывать') continue;


      allRuns.push({

        date: date,

        name: name,

        km: km

      });

    }


    /*
      Сортировка от старых к новым
    */

    allRuns.sort(
      (a,b) => a.date - b.date
    );


    updatePeriodButtons();

    render();


    const status =
      document.getElementById('status');

    status.textContent =
      'Данные обновлены';

    status.className =
      'status ok';


  }

  catch(error){

    console.error(error);


    const status =
      document.getElementById('status');

    status.textContent =
      'Не удалось загрузить данные';

    status.className =
      'status error';


    document.getElementById('ranking').innerHTML =
      '<div class="note">Не удалось загрузить статистику.</div>';


    document.getElementById('months').innerHTML =
      '<div class="note">Не удалось загрузить статистику.</div>';

  }

}


/* =====================================================
   ПОСЛЕДНИЙ МЕСЯЦ
   ===================================================== */

function getLatestMonth(){

  if(!allRuns.length){

    return null;

  }


  const latest =
    allRuns[allRuns.length - 1].date;


  return {

    year: latest.getFullYear(),

    month: latest.getMonth()

  };

}


/* =====================================================
   ФИЛЬТР
   ===================================================== */

function getFilteredRuns(){

  if(!allRuns.length){

    return [];

  }


  /*
    ВСЁ ВРЕМЯ
  */

  if(period === 'all'){

    return allRuns;

  }


  const latest =
    getLatestMonth();


  if(!latest){

    return [];

  }


  /*
    ПОСЛЕДНИЙ МЕСЯЦ
  */

  if(period === 'month'){

    return allRuns.filter(x =>

      x.date.getFullYear() === latest.year &&

      x.date.getMonth() === latest.month

    );

  }


  /*
    КВАРТАЛ
  */

  if(period === 'quarter'){

    const quarter =
      Math.floor(latest.month / 3);


    return allRuns.filter(x => {

      const q =
        Math.floor(x.date.getMonth() / 3);


      return (

        x.date.getFullYear() === latest.year &&

        q === quarter

      );

    });

  }


  /*
    ГОД
  */

  if(period === 'year'){

    return allRuns.filter(x =>

      x.date.getFullYear() === latest.year

    );

  }


  return [];

}


/* =====================================================
   СТАТИСТИКА
   ===================================================== */

function calculateStats(runs){

  const totalKm =
    runs.reduce(
      (sum,x) => sum + x.km,
      0
    );


  const names =
    new Set(
      runs.map(x => x.name)
    );


  const people =
    names.size;


  const count =
    runs.length;


  const avg =
    people
      ? totalKm / people
      : 0;


  return {

    totalKm,

    people,

    count,

    avg

  };

}


/* =====================================================
   РЕЙТИНГ
   ===================================================== */

function calculateRanking(runs){

  const sums = {};


  runs.forEach(x => {

    if(!sums[x.name]){

      sums[x.name] = {

        name:x.name,

        km:0,

        runs:0

      };

    }


    sums[x.name].km += x.km;

    sums[x.name].runs++;

  });


  return Object.values(sums)
    .sort(
      (a,b) => b.km - a.km
    );

}


/* =====================================================
   МЕСЯЦЫ
   ===================================================== */

function calculateMonths(){

  const months = {};


  allRuns.forEach(x => {

    const year =
      x.date.getFullYear();


    const month =
      x.date.getMonth();


    const key =
      year + '-' +
      String(month + 1).padStart(2,'0');


    if(!months[key]){

      months[key] = {

        key:key,

        year:year,

        month:month,

        km:0,

        runs:0

      };

    }


    months[key].km += x.km;

    months[key].runs++;

  });


  return Object.values(months)
    .sort(
      (a,b) =>
        a.key.localeCompare(b.key)
    );

}


/* =====================================================
   КНОПКИ
   ===================================================== */

function updatePeriodButtons(){

  const latest =
    getLatestMonth();


  if(!latest){

    document.getElementById('monthButton')
      .textContent =
      'Последний месяц';

    document.getElementById('quarterButton')
      .textContent =
      'Квартал';

    document.getElementById('yearButton')
      .textContent =
      'Год';

    return;

  }


  const monthName =
    monthsNames[latest.month];


  const quarter =
    Math.floor(latest.month / 3) + 1;


  document.getElementById('monthButton')
    .textContent =
    monthName + ' ' + latest.year;


  document.getElementById('quarterButton')
    .textContent =
    quarter + ' квартал ' + latest.year;


  document.getElementById('yearButton')
    .textContent =
    String(latest.year);

}


/* =====================================================
   ОТРИСОВКА
   ===================================================== */

function render(){

  const runs =
    getFilteredRuns();


  const stats =
    calculateStats(runs);


  /*
    КАРТОЧКИ
  */

  document.getElementById('total')
    .textContent =
    stats.totalKm.toFixed(1);


  document.getElementById('people')
    .textContent =
    stats.people;


  document.getElementById('runs')
    .textContent =
    stats.count;


  document.getElementById('avg')
    .textContent =
    stats.avg.toFixed(1);


  /*
    РЕЙТИНГ
  */

  const ranking =
    calculateRanking(runs);


  const rankingElement =
    document.getElementById('ranking');


  /*
    Если нет пробежек —
    рейтинг вообще не показываем
  */

  if(!runs.length){

    rankingElement.innerHTML =
      '<div class="note">' +
      '🏃 Пока нет пробежек за выбранный период.' +
      '</div>';

  }

  else{

    const max =
      Math.max(
        ...ranking.map(x => x.km),
        1
      );


    rankingElement.innerHTML =
      ranking.map((x,i) => {

        let place;


        if(i === 0){

          place = '🥇';

        }

        else if(i === 1){

          place = '🥈';

        }

        else if(i === 2){

          place = '🥉';

        }

        else{

          place = i + 1;

        }


        return `

          <div class="rank">

            <div class="place">
              ${place}
            </div>

            <div class="name">

              ${escapeHTML(x.name)}

              <div class="bar">

                <i
                  style="
                    width:${(x.km / max) * 100}%
                  "
                ></i>

              </div>

            </div>

            <div class="km">

              ${x.km.toFixed(1)} км

            </div>

          </div>

        `;

      }).join('');

  }


  /*
    МЕСЯЦЫ
  */

  const months =
    calculateMonths();


  const monthsElement =
    document.getElementById('months');


  if(!months.length){

    monthsElement.innerHTML =
      '<div class="note">' +
      'Пока нет данных.' +
      '</div>';

    return;

  }


  const maxMonth =
    Math.max(
      ...months.map(x => x.km),
      1
    );


  monthsElement.innerHTML =
    months.map(x => {

      const name =
        monthsNames[x.month];


      return `

        <div class="month">

          <b>
            ${name} ${x.year}
          </b>

          <div class="monthbar">

            <i
              style="
                width:${(x.km / maxMonth) * 100}%
              "
            ></i>

          </div>

          <b>
            ${x.km.toFixed(1)}
          </b>

        </div>

      `;

    }).join('');

}


/* =====================================================
   БЕЗОПАСНЫЙ ВЫВОД ИМЕНИ
   ===================================================== */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =====================================================
   ПЕРЕКЛЮЧЕНИЕ ПЕРИОДА
   ===================================================== */

function setPeriod(p,btn){

  period = p;


  document
    .querySelectorAll('.tabs button')
    .forEach(b =>
      b.classList.remove('active')
    );


  btn.classList.add('active');


  render();

}


/* =====================================================
   ЗАПУСК
   ===================================================== */

loadData();


/*
  Обновляем данные автоматически
  каждые 5 минут.
*/

setInterval(
  loadData,
  5 * 60 * 1000
);

</script>

</body>
</html>
